# CI: build and test on push and PR to main/master
name: CI

on:
  push:
    branches: [master, main]
    # Changes to the website, the manual or to Markdown files alone don't need a build.
    paths-ignore:
      - "website/**"
      - "manual/**"
      - "**/*.md"
  pull_request:
    branches: [master, main]
    # Changes to the website, the manual or to Markdown files alone don't need a build.
    paths-ignore:
      - "website/**"
      - "manual/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# A new push stops the run still going for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux:
    name: Build (Ubuntu, Qt 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ends a hanging package mirror early instead of at GitHub's six-hour limit
      # (same as in codeql.yml).
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6opengl6-dev libgl-dev \
            libboost-test-dev libboost-dev \
            libjpeg-dev libpng-dev libtiff-dev zlib1g-dev libopenjp2-7-dev \
            libtesseract-dev libleptonica-dev \
            poppler-utils

      - name: Configure and build
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      # Failing tests fail the build.
      - name: Run tests
        working-directory: build
        # No display needed: CMake runs every test with QT_QPA_PLATFORM=offscreen on Linux.
        run: ctest -C Release --output-on-failure

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      # The MCP server tests run against the CLI built above; no second build needed.
      - name: Run MCP server tests
        working-directory: tools/mcp
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
          SCANTAILOR_OCR_CLI: ${{ github.workspace }}/build/scantailor-ocr-cli
        run: |
          uv sync --locked
          uv run --locked pytest -rs

  build-windows:
    name: Build (Windows, MSVC + vcpkg)
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      # Built packages are cached between runs. The first run builds Qt and
      # takes about two hours, later runs only a few minutes.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release workflow (release.yml) and the CodeQL workflow (codeql.yml) use the
      # cache saved here; all three read the package list from scripts/setup/support/vcpkg-packages.txt.
      - name: Set up Windows build environment
        uses: ./.github/actions/setup-windows-build
        with:
          save-cache: 'true'

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        shell: pwsh
        working-directory: build
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_PLUGIN_PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\Qt6\plugins"
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          ctest -C Release --output-on-failure

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      # The MCP server tests run against the CLI built above; no second build needed.
      - name: Run MCP server tests
        working-directory: tools/mcp
        timeout-minutes: 15
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          SCANTAILOR_OCR_CLI: ${{ github.workspace }}\build\scantailor-ocr-cli.exe
        # VCPKG_INSTALLATION_ROOT is a variable of the runner, not of the workflow, so ${{ env }}
        # doesn't have it; the shell does, as in the ctest step.
        run: |
          $env:QT_PLUGIN_PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\Qt6\plugins"
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          uv sync --locked
          uv run --locked pytest -rs
