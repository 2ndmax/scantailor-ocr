name: CMake

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build-linux-qt6:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --fix-missing \
          build-essential gcc g++ cmake \
          libjpeg-dev libpng-dev \
          libtiff6 libtiff-dev zlib1g-dev libopenjp2-7-dev \
          libtesseract-dev libleptonica-dev \
          libboost-test-dev libboost-dev \
          qt6-base-dev qt6-svg-dev \
          qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
          libqt6opengl6-dev libgl-dev \
          libpthread-stubs0-dev \
          rpm libfuse2t64

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B "${{ github.workspace }}/build" -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build "${{ github.workspace }}/build" --config ${{env.BUILD_TYPE}}
      
    - name: Create DEB package
      working-directory: "${{ github.workspace }}/build"
      run: |
        cpack -G "DEB"
        mv scantailor*.deb scantailor-ocr.deb
      
    - name: Create RPM package
      working-directory: "${{ github.workspace }}/build"
      run: |
        cpack -G "RPM"
        mv scantailor*.rpm scantailor-ocr.rpm
        
    - name: Create AppImage package
      working-directory: "${{ github.workspace }}/build"
      run: |
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage
        ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --desktop-file "${{ github.workspace }}/build/scantailor-ocr.desktop" \
          --icon-file "${{ github.workspace }}/src/resources/scantailor-ocr.png" \
          --executable scantailor-ocr \
          --output appimage
        mv ScanTailor*.AppImage scantailor-ocr.AppImage
      
    - name: Upload Linux bin
      uses: actions/upload-artifact@v7
      with:
        name: scantailor-linux-ubuntu-latest-qt6
        path: build/scantailor-ocr

    - name: Upload Linux DEB
      uses: actions/upload-artifact@v7
      with:
        name: scantailor-linux-ubuntu-latest-qt6-deb
        path: build/scantailor-ocr.deb

    - name: Upload Linux RPM
      uses: actions/upload-artifact@v7
      with:
        name: scantailor-linux-ubuntu-latest-qt6-rpm
        path: build/scantailor-ocr.rpm

    - name: Upload Linux AppImage
      uses: actions/upload-artifact@v7
      with:
        name: scantailor-linux-appimage
        path: build/scantailor-ocr.AppImage
