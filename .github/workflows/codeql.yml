# CodeQL: static analysis of the C++ code on Linux and Windows. Runs every Monday and when started by hand.
name: CodeQL

on:
  # Every Monday at 03:00 UTC.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-linux:
    name: Analyze (C++, Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Needed to upload the results to Security > Code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The packages of the Linux build in ci.yml, without poppler-utils (the analysis runs no
      # tests). Kept by hand, see the REVIEW-NOTE in scripts/setup/support/ubuntu-packages.txt.
      # A hanging package mirror otherwise holds the job until GitHub's six-hour limit
      # (seen on 2026-11-23); the installation normally takes a few minutes.
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6opengl6-dev libgl-dev \
            libboost-test-dev libboost-dev \
            libjpeg-dev libpng-dev libtiff-dev zlib1g-dev libopenjp2-7-dev \
            libtesseract-dev libleptonica-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # CodeQL watches this build to see which files are compiled and how.
      - name: Configure and build
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:c-cpp/os:linux
          output: sarif-results

      # The results as a file, to download from the run's page.
      - name: Upload SARIF file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f4646cd9 # v7.0.2
        with:
          name: codeql-sarif-linux
          path: sarif-results

  analyze-windows:
    name: Analyze (C++, Windows)
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
      # Needed to upload the results to Security > Code scanning.
      security-events: write
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The package cache is created by the CI workflow (ci.yml) on master; this workflow
      # only reads it. Without it vcpkg builds Qt, which takes about two hours.
      - name: Set up Windows build environment
        uses: ./.github/actions/setup-windows-build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # CodeQL watches this build to see which files are compiled and how.
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel

      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:c-cpp/os:windows
          output: sarif-results

      # The results as a file, to download from the run's page.
      - name: Upload SARIF file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f4646cd9 # v7.0.2
        with:
          name: codeql-sarif-windows
          path: sarif-results
