# CodeQL: static analysis of the C++ code. Runs only when started by hand.
name: CodeQL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (C++, Ubuntu)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Needed to upload the results to Security > Code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Same packages as the Linux build in ci.yml.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6opengl6-dev libgl-dev \
            libboost-test-dev libboost-dev \
            libjpeg-dev libpng-dev libtiff-dev zlib1g-dev libopenjp2-7-dev \
            libtesseract-dev libleptonica-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      # CodeQL watches this build to see which files are compiled and how.
      - name: Configure and build
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
          output: sarif-results

      # The results as a file, to download from the run's page.
      - name: Upload SARIF file
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: sarif-results
