# Lint: clang-format check on changed files only (fails if changed code would be reformatted)
name: Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The same version as in Visual Studio 2026, so that local checks give the
      # same result (other versions format some lines differently).
      - name: Install clang-format
        run: |
          pip install clang-format==22.1.3
          clang-format --version

      - name: Get changed source files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Empty when started by hand (workflow_dispatch): check the last commit.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          # Deleted files can't be checked (--diff-filter=d leaves them out).
          SRC_FILES=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- src/ \
            | grep -E '\.(cpp|h)$' \
            | grep -v '/translations/' \
            | grep -v '/jbig2enc/' \
            || true)
          if [ -z "$SRC_FILES" ]; then
            COUNT=0
          else
            COUNT=$(echo "$SRC_FILES" | grep -c .)
          fi
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" = "0" ]; then
            echo "No changed source files to check."
            exit 0
          fi
          echo "$SRC_FILES" > changed_files.txt

      - name: Check formatting
        if: steps.changed.outputs.count != '0'
        run: |
          cat changed_files.txt | xargs clang-format --dry-run -Werror
          echo "All changed files are formatted."
