# Pages: build the manual into website/manual and publish the website/ folder to GitHub Pages
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "manual/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # The manual (MkDocs) is built into website/manual and published with the website.
      - name: Build manual
        run: uvx --from mkdocs --with-requirements manual/requirements.txt mkdocs build --strict -f manual/mkdocs.yml -d ../website/manual
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v5
