# Release: build the Windows ZIP, .deb and AppImage and attach them to a GitHub Release
# on a version tag (issues #64, #37).  Started by hand ("Run workflow"), it only builds
# the packages and keeps them as artifacts of the run, without a release.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows ZIP
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      # The OCR languages shipped with the program: German and English from tessdata_best,
      # fixed to one commit and checked, so every release contains the same files.
      TESSDATA_COMMIT: e12c65a915945e4c28e237a9b52bc4a8f39a0cec
    steps:
      - uses: actions/checkout@v5

      - name: Set version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $version = "${{ github.ref_name }}".Substring(1)
            (Get-Content version.h.in) -replace '^#define VERSION "[^"]*"', "#define VERSION `"$version`"" |
              Set-Content version.h.in
          } else {
            # A test build: the version from version.h.in, marked as such.
            $base = (Select-String -Path version.h.in -Pattern '^#define VERSION "([^"]*)"').Matches[0].Groups[1].Value
            $version = "$base-test.${{ github.run_number }}"
          }
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # The package cache is created by the CI workflow (ci.yml) on master; this workflow
      # only reads it.  Without it, building the dependencies takes about two hours.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ runner.os }}-

      # Keep the package list the same as in ci.yml, so the cached packages are used.
      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            --clean-after-build `
            "--x-buildtrees-root=$env:RUNNER_TEMP\vcpkg-buildtrees" `
            "--x-packages-root=$env:RUNNER_TEMP\vcpkg-packages" `
            "--downloads-root=$env:RUNNER_TEMP\vcpkg-downloads" `
            qtbase qtsvg qttools libjpeg-turbo libpng `
            "tiff[core,jpeg,zip,lzma,zstd,webp,lerc,libdeflate]" openjpeg zlib tesseract `
            boost-test boost-foreach boost-intrusive boost-multi-index boost-lambda

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # The tests already run in the CI workflow for the same commit.
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: cmake --build build --parallel

      - name: Download OCR languages
        shell: pwsh
        run: |
          $expected = @{
            "deu" = "8407331d6aa0229dc927685c01a7938fc5a641d1a9524f74838cdac599f0d06e"
            "eng" = "8280aed0782fe27257a68ea10fe7ef324ca0f8d85bd2fd145d1c2b560bcb66ba"
          }
          New-Item -ItemType Directory -Force build\tessdata | Out-Null
          foreach ($language in $expected.Keys) {
            $file = "build\tessdata\$language.traineddata"
            Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_best/raw/$env:TESSDATA_COMMIT/$language.traineddata" -OutFile $file
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            if ($hash -ne $expected[$language]) { throw "Checksum of $language.traineddata is wrong: $hash" }
            Write-Host "$language.traineddata OK"
          }

      # The same script as for a local build, in Windows PowerShell 5.1 as there: DLLs,
      # Qt plugins, translations, languages, license texts, a start test and the ZIP.
      - name: Package
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\package-windows.ps1 `
            -Version "${{ steps.version.outputs.version }}" -BuildDir build -VcpkgRoot "$env:VCPKG_INSTALLATION_ROOT"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $zip = Get-Item "build\package\*.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash
          "| File | Size | SHA256 |`n|---|---|---|`n| $($zip.Name) | $([Math]::Round($zip.Length / 1MB, 1)) MB | ``$hash`` |" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-zip
          path: build/package/*.zip

  build-deb:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^#define VERSION \"[^\"]*\"/#define VERSION \"${VERSION}\"/" version.h.in

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools libqt6opengl6-dev libgl-dev \
            libboost-test-dev libboost-dev \
            libjpeg-dev libpng-dev libtiff-dev zlib1g-dev libopenjp2-7-dev \
            libtesseract-dev libleptonica-dev

      - name: Build .deb
        run: ./build-deb.sh build

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: deb-package
          path: scantailor-ocr_*_amd64.deb

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^#define VERSION \"[^\"]*\"/#define VERSION \"${VERSION}\"/" version.h.in

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools libqt6opengl6-dev libgl-dev \
            libboost-test-dev libboost-dev \
            libjpeg-dev libpng-dev libtiff-dev zlib1g-dev libopenjp2-7-dev \
            libtesseract-dev libleptonica-dev \
            file

      - name: Build and install to AppDir
        run: |
          mkdir build-appimage && cd build-appimage
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr ..
          make -j$(nproc)
          make install DESTDIR=AppDir

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          VERSION: ${{ github.ref_name }}
          DISABLE_COPYRIGHT_FILES_DEPLOYMENT: 1
        run: |
          cd build-appimage
          export QMAKE=/usr/bin/qmake6
          # Bundle Qt platform plugins (e.g. xcb) via linuxdeploy-plugin-qt; same-dir discovery.
          ../linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt -e AppDir/usr/bin/scantailor-ocr --output appimage
          OUT=$(ls -1 *.AppImage 2>/dev/null | head -1)
          mv "$OUT" "../scantailor-ocr-${{ github.ref_name }}-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v5
        with:
          name: appimage
          path: scantailor-ocr-*-x86_64.AppImage

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-deb, build-appimage]
    # Only for a version tag, not for a test build started by hand.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: windows-zip
      - uses: actions/download-artifact@v5
        with:
          name: deb-package
      - uses: actions/download-artifact@v5
        with:
          name: appimage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ScanTailor-OCR-*-win64.zip
            scantailor-ocr_*_amd64.deb
            scantailor-ocr-*-x86_64.AppImage
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
